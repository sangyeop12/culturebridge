# Paid single-instance deployment. Retention enabled at the user's explicit request.
services:
  - type: web
    name: culturebridge
    runtime: python
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements-lock.txt && pip install --no-deps .
    startCommand: python -m uvicorn culturebridge.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    disk:
      name: culturebridge-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: GEMINI_API_KEY
        sync: false
      - key: CULTUREBRIDGE_STORAGE_SECRET
        generateValue: true
      - key: CULTUREBRIDGE_PUBLIC_MODE
        value: "true"
      - key: CULTUREBRIDGE_SECURE_COOKIES
        value: "true"
      - key: CULTUREBRIDGE_DB_PATH
        value: /var/data/culturebridge.db
      - key: NICEGUI_STORAGE_PATH
        value: /var/data/nicegui
      - key: CULTUREBRIDGE_BACKUP_DIR
        value: /var/data/backups
      - key: CULTUREBRIDGE_MAINTENANCE_ENABLED
        value: "true"
      - key: CULTUREBRIDGE_MAINTENANCE_INTERVAL_HOURS
        value: "24"
      - key: CULTUREBRIDGE_BACKUP_KEEP
        value: "14"
      - key: CULTUREBRIDGE_RETENTION_ENABLED
        value: "true"
      - key: CULTUREBRIDGE_RECORD_RETENTION_DAYS
        value: "90"
