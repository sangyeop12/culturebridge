[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "culturebridge"
version = "0.1.0"
description = "AI Agent 기반 국가별 문화유산 비교 탐구 교육 플랫폼"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "defusedxml>=0.7,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "google-genai>=1.0,<2",
  "langgraph>=1.0,<2",
  "nicegui>=3.0,<4",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
culturebridge = "culturebridge.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/culturebridge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
